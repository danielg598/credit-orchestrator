spring:
  application:
    name: credit-orchestrator
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

# =====================================================================
#  Configuración de la aplicación
#  Para pasar a Vault real: solo cambiar las variables de entorno
#     APP_AI_MODE=real
#     APP_VAULT_BASE_URL=https://core-api.tm.blx-demo.com
#     APP_VAULT_AUTH_TOKEN=<token real>
# =====================================================================
app:
  ai:
    mode: ${APP_AI_MODE:mock}              # mock | real
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
  vault:
    base-url: ${APP_VAULT_BASE_URL:http://localhost:9000}
    auth-token: ${APP_VAULT_AUTH_TOKEN:mock-dev-token}
    product-id: ${APP_VAULT_PRODUCT_ID:personal_loan_ai}   # en real: "8369"
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# =====================================================================
#  Resilience4j — circuit breaker + retry para cada servicio externo
# =====================================================================
resilience4j:
  circuitbreaker:
    instances:
      aiService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      vaultService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
  retry:
    instances:
      aiService:
        max-attempts: 3
        wait-duration: 500ms
      vaultService:
        max-attempts: 2
        wait-duration: 800ms

# =====================================================================
#  Logging
# =====================================================================
logging:
  level:
    co.lumen.credit: DEBUG
    org.springframework.web.client: INFO
