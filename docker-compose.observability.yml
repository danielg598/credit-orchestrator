services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI (http://localhost:16686)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (Spring Boot exporta aqui)
